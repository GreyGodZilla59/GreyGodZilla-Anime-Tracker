<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grey GodZilla Anime Tracker v1.1.3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow"></div>

  <header class="header">
    <div class="header-accent"></div>
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/greygodzilla_logo.png" alt="Grey GodZilla">
        <div class="brand-text">
          <div class="brand-row">
            <h1>Grey GodZilla</h1>
            <span class="version-badge" id="version-badge">v1.1.3</span>
          </div>
          <p class="brand-sub">Anime Tracker · Daily · Weekly · Monthly</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">Starting</span>
        </div>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="search" id="search" placeholder="Search anime..." autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <section class="stats-bar" id="stats-bar">
    <div class="stat-tile"><span class="stat-label">Today</span><span class="stat-value" id="stat-daily">—</span></div>
    <div class="stat-tile"><span class="stat-label">This Week</span><span class="stat-value" id="stat-weekly">—</span></div>
    <div class="stat-tile"><span class="stat-label">This Month</span><span class="stat-value" id="stat-monthly">—</span></div>
    <div class="stat-tile"><span class="stat-label">Airing</span><span class="stat-value" id="stat-now">—</span></div>
    <div class="stat-tile"><span class="stat-label">Upcoming</span><span class="stat-value" id="stat-upcoming">—</span></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="daily" role="tab">
      <span class="tab-label">Today</span>
      <span class="tab-count" id="count-daily">—</span>
    </button>
    <button class="tab" data-tab="weekly" role="tab">
      <span class="tab-label">This Week</span>
      <span class="tab-count" id="count-weekly">—</span>
    </button>
    <button class="tab" data-tab="monthly" role="tab">
      <span class="tab-label">This Month</span>
      <span class="tab-count" id="count-monthly">—</span>
    </button>
    <button class="tab" data-tab="now" role="tab">
      <span class="tab-label">Airing Now</span>
      <span class="tab-count" id="count-now">—</span>
    </button>
    <button class="tab" data-tab="upcoming" role="tab">
      <span class="tab-label">Upcoming</span>
      <span class="tab-count" id="count-upcoming">—</span>
    </button>
    <button class="tab" data-tab="webhooks" role="tab">
      <span class="tab-label">Webhooks</span>
      <span class="tab-count" id="count-webhooks">—</span>
    </button>
  </nav>

  <div id="subheader" class="subheader hidden"></div>

  <main class="main">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p id="loading-text">Loading today's releases...</p>
    </div>

    <div id="error" class="error hidden">
      <p id="error-message">Something went wrong.</p>
      <button id="retry-btn" class="retry-btn">Try Again</button>
    </div>

    <div id="content" class="content hidden"></div>
    <div id="empty" class="empty hidden">
      <p id="empty-message">Nothing to show.</p>
    </div>
  </main>

  <footer class="footer">
    <p id="app-version-line"><strong>Grey GodZilla</strong> · Grey GodZilla Anime Tracker v1.1.3</p>
    <p>Data from <a href="https://jikan.moe" target="_blank" rel="noopener">Jikan API</a> (MyAnimeList)</p>
    <p class="updated" id="last-updated"></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
